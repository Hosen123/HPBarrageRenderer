<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Christmas Tree</title>
    
    <!-- Visual Identity & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Times+New+Roman&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-gold: #FFD700;
            --color-cream: #FFF8DC;
            --color-bg: #050505;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--color-bg);
            font-family: 'Times New Roman', serif;
            color: var(--color-cream);
            user-select: none;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Title */
        h1 {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 56px;
            margin: 0;
            background: linear-gradient(to bottom, #ffffff, var(--color-gold), #ff4400);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* Upload Control */
        .upload-wrapper {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: auto;
            z-index: 20;
        }

        .btn-upload {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(20, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--color-gold);
            color: var(--color-gold);
            font-family: 'Cinzel', serif;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.2);
            border-radius: 30px;
        }

        .btn-upload:hover {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 35px rgba(255, 69, 0, 0.5);
            transform: scale(1.05);
        }

        .hint-text {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.9;
            font-style: italic;
            color: #ffaa88;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        /* Loader */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-top: 3px solid var(--color-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 20px var(--color-gold);
        }

        .loading-text {
            font-family: 'Cinzel', serif;
            color: var(--color-gold);
            letter-spacing: 4px;
            font-size: 14px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Webcam Container (Hidden for processing) */
        .vision-container {
            position: absolute;
            bottom: 10px;
            right: 10px;
            opacity: 0; 
            pointer-events: none;
            z-index: 0;
        }

        /* Status Indicator for CV */
        #cv-status {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 12px;
            color: var(--color-gold);
            font-family: monospace;
            opacity: 0.7;
        }
    </style>

    <!-- Import Maps -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loading-text">LOADING HOLIDAY MAGIC</div>
    </div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <h1>Merry Christmas</h1>
        <div id="cv-status">CV: Initializing...</div>

        <div class="upload-wrapper">
            <label class="btn-upload">
                Add Memories
                <input type="file" id="photo-input" accept="image/*" style="display: none;">
            </label>
            <div class="hint-text">Move Hand: Close=Shrink, Far=Expand, Wave=Rotate</div>
            <div class="hint-text" style="font-size: 12px; opacity: 0.6;">Press 'H' to Hide UI</div>
        </div>
    </div>

    <!-- Vision processing elements -->
    <div class="vision-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas" width="160" height="120"></canvas>
    </div>

    <!-- Main Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- Configuration ---
        const CONFIG = {
            particleCount: 1800,
            dustCount: 3000,
            colors: {
                gold: 0xFFD700,
                cream: 0xFFF8DC,
                red: 0xFF0044, // Vibrant Red
                green: 0x008844, // Rich Green
                purple: 0x9900FF, // Accent
                orange: 0xFF6600
            },
            modes: {
                TREE: 'TREE'
            }
        };

        // --- Global State ---
        const STATE = {
            mode: CONFIG.modes.TREE,
            handRotation: { x: 0, y: 0 },
            expansion: 1.0, // 1.0 = normal, 0.5 = contracted, 2.0 = expanded
            targetExpansion: 1.0,
            time: 0
        };

        // --- Assets & Utilities ---
        
        // Procedural Candy Cane Texture
        function createCandyCaneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 128, 128);
            
            ctx.fillStyle = '#FF0044';
            ctx.translate(64, 64);
            ctx.rotate(Math.PI / 4);
            for(let i = -100; i < 100; i+=20) {
                ctx.fillRect(i, -100, 10, 200);
            }
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // Default Photo Texture
        function createDefaultPhotoTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Gradient Background
            const grd = ctx.createLinearGradient(0, 0, 0, 512);
            grd.addColorStop(0, '#FFD700');
            grd.addColorStop(1, '#FF4400');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, 512, 512);
            
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 60px "Cinzel"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 10;
            ctx.fillText("JOYEUX", 256, 200);
            ctx.fillText("NOEL", 256, 280);
            
            // Border
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 15;
            ctx.strokeRect(20, 20, 472, 472);

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // --- Particle Class ---
        class Particle {
            constructor(mesh, type, index) {
                this.mesh = mesh;
                this.type = type; // 'orb', 'box', 'cane', 'photo'
                this.index = index;
                this.basePos = new THREE.Vector3(); // The theoretical position in the tree
                this.randomOffset = new THREE.Vector3(
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2
                );
                
                // Initialize in random space
                this.mesh.position.set(
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100
                );

                // Calculate Tree Position once
                const t = index / CONFIG.particleCount;
                const h = (t * 22) - 11; // Height
                const angle = t * 45 * Math.PI;
                const maxRadius = 9;
                const radius = maxRadius * (1 - t); // Cone shape
                
                this.basePos.set(
                    Math.cos(angle) * radius,
                    h,
                    Math.sin(angle) * radius
                );
            }

            update(time, expansion) {
                // Dynamic Layout Calculation
                // Position = BasePos * Expansion
                // Add some floating motion
                
                const floatY = Math.sin(time * 2 + this.index * 0.1) * 0.2;
                const floatX = Math.cos(time * 1.5 + this.index * 0.05) * 0.1;
                
                const targetX = this.basePos.x * expansion + floatX;
                const targetY = this.basePos.y * expansion + floatY; // Height also expands slightly? No, mostly keep height structure, maybe stretch a bit
                const targetZ = this.basePos.z * expansion;

                // Move mesh towards target
                this.mesh.position.x += (targetX - this.mesh.position.x) * 0.1;
                this.mesh.position.y += (targetY - this.mesh.position.y) * 0.1;
                this.mesh.position.z += (targetZ - this.mesh.position.z) * 0.1;

                // Rotation
                this.mesh.rotation.y += 0.02;
                this.mesh.rotation.x += 0.01;
            }
        }

        // --- Main Application ---
        class App {
            constructor() {
                this.particles = [];
                this.dustSystem = null;
                this.mainGroup = new THREE.Group();
                this.container = document.createElement('div');
                document.body.appendChild(this.container);

                this.init();
            }

            async init() {
                // 1. Scene Setup
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.FogExp2(0x050505, 0.015);

                this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 0, 40); // Adjusted for better view

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                this.container.appendChild(this.renderer.domElement);

                // 2. Environment & Lighting
                const pmremGenerator = new THREE.PMREMGenerator(this.renderer);
                this.scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

                const ambientLight = new THREE.AmbientLight(0xffccaa, 0.4);
                this.scene.add(ambientLight);

                // Warm Center Light
                const pointLight = new THREE.PointLight(CONFIG.colors.orange, 5, 60);
                pointLight.position.set(0, 0, 10);
                this.scene.add(pointLight);

                // Top Gold Spotlight
                const spotLight1 = new THREE.SpotLight(CONFIG.colors.gold, 800);
                spotLight1.position.set(20, 40, 20);
                spotLight1.angle = 0.6;
                spotLight1.penumbra = 0.5;
                this.scene.add(spotLight1);

                // Side Accent Light (Purple/Magenta)
                const spotLight2 = new THREE.SpotLight(CONFIG.colors.purple, 1200); 
                spotLight2.position.set(-30, 10, 30);
                spotLight2.penumbra = 1;
                this.scene.add(spotLight2);

                this.scene.add(this.mainGroup);

                // 3. Post-Processing
                this.composer = new EffectComposer(this.renderer);
                const renderPass = new RenderPass(this.scene, this.camera);
                this.composer.addPass(renderPass);

                const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
                bloomPass.strength = 0.7; // Enhanced bloom
                bloomPass.radius = 0.5;
                bloomPass.threshold = 0.6;
                this.composer.addPass(bloomPass);

                // 4. Content Generation
                this.createMaterials();
                this.generateParticles();
                this.generateDust();
                this.addDefaultPhoto();

                // 5. Interaction & Events
                this.setupEventListeners();
                this.setupInputs();

                // 6. MediaPipe
                await this.setupVision();

                // 7. Start Loop
                document.getElementById('loader').style.opacity = 0;
                setTimeout(() => document.getElementById('loader').remove(), 1000);
                this.animate();
            }

            createMaterials() {
                const envMapIntensity = 1.5;
                this.materials = {
                    gold: new THREE.MeshStandardMaterial({ 
                        color: CONFIG.colors.gold, 
                        roughness: 0.1, 
                        metalness: 1.0,
                        emissive: 0x221100,
                        envMapIntensity
                    }),
                    green: new THREE.MeshStandardMaterial({ 
                        color: CONFIG.colors.green, 
                        roughness: 0.3, 
                        metalness: 0.4,
                        emissive: 0x001100,
                        envMapIntensity
                    }),
                    red: new THREE.MeshPhysicalMaterial({ 
                        color: CONFIG.colors.red, 
                        metalness: 0.2, 
                        roughness: 0.1, 
                        clearcoat: 1.0,
                        emissive: 0x330000,
                        envMapIntensity
                    }),
                    purple: new THREE.MeshPhysicalMaterial({
                        color: CONFIG.colors.purple,
                        metalness: 0.5,
                        roughness: 0.2,
                        clearcoat: 1.0,
                        emissive: 0x220033
                    }),
                    cane: new THREE.MeshStandardMaterial({
                        map: createCandyCaneTexture(),
                        roughness: 0.3,
                        emissive: 0x111111
                    }),
                    photoFrame: new THREE.MeshStandardMaterial({
                        color: CONFIG.colors.gold,
                        roughness: 0.1,
                        metalness: 0.9
                    })
                };
            }

            generateParticles() {
                const sphereGeo = new THREE.SphereGeometry(0.35, 32, 32);
                const boxGeo = new THREE.BoxGeometry(0.45, 0.45, 0.45);
                const diamondGeo = new THREE.OctahedronGeometry(0.3);

                for (let i = 0; i < CONFIG.particleCount; i++) {
                    let mesh, type;
                    const r = Math.random();

                    if (r < 0.4) { // Orbs (Red & Gold)
                        mesh = new THREE.Mesh(sphereGeo, Math.random() > 0.5 ? this.materials.gold : this.materials.red);
                        type = 'orb';
                    } else if (r < 0.7) { // Boxes (Green & Purple)
                        mesh = new THREE.Mesh(boxGeo, Math.random() > 0.5 ? this.materials.green : this.materials.purple);
                        type = 'box';
                    } else { // Diamonds/Canes
                        mesh = new THREE.Mesh(diamondGeo, this.materials.gold);
                        type = 'diamond';
                    }

                    this.mainGroup.add(mesh);
                    this.particles.push(new Particle(mesh, type, i));
                }
            }

            generateDust() {
                const geometry = new THREE.BufferGeometry();
                const vertices = [];
                for (let i = 0; i < CONFIG.dustCount; i++) {
                    vertices.push(
                        (Math.random() - 0.5) * 60,
                        (Math.random() - 0.5) * 60,
                        (Math.random() - 0.5) * 60
                    );
                }
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                
                const sprite = new THREE.TextureLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/sprites/spark1.png');
                
                const material = new THREE.PointsMaterial({
                    color: CONFIG.colors.cream,
                    size: 0.4,
                    map: sprite,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                
                this.dustSystem = new THREE.Points(geometry, material);
                this.scene.add(this.dustSystem);
            }

            addDefaultPhoto() {
                this.addPhotoToScene(createDefaultPhotoTexture());
            }

            addPhotoToScene(texture) {
                const ratio = texture.image ? texture.image.width / texture.image.height : 1;
                const geometry = new THREE.BoxGeometry(2.5 * ratio, 2.5, 0.1);
                
                const mats = [
                    this.materials.photoFrame,
                    this.materials.photoFrame,
                    this.materials.photoFrame,
                    this.materials.photoFrame,
                    new THREE.MeshBasicMaterial({ map: texture }), 
                    this.materials.photoFrame 
                ];

                const mesh = new THREE.Mesh(geometry, mats);
                // Position photo near center but slightly up
                this.mainGroup.add(mesh);
                
                // Add as a special particle (always index 0 effectively for logic)
                const p = new Particle(mesh, 'photo', 0);
                p.basePos.set(0, 2, 8); // Fixed position in tree
                this.particles.push(p);
            }

            setupInputs() {
                const input = document.getElementById('photo-input');
                const reader = new FileReader();
                
                input.addEventListener('change', (e) => {
                    const f = e.target.files[0];
                    if (!f) return;
                    reader.onload = (ev) => {
                        new THREE.TextureLoader().load(ev.target.result, (t) => {
                            t.colorSpace = THREE.SRGBColorSpace;
                            this.addPhotoToScene(t);
                        });
                    };
                    reader.readAsDataURL(f);
                    input.value = '';
                });

                window.addEventListener('keydown', (e) => {
                    if (e.key.toLowerCase() === 'h') {
                        document.getElementById('ui-layer').classList.toggle('ui-hidden');
                    }
                });
            }

            setupEventListeners() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                    this.composer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            async setupVision() {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                
                const handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });

                const video = document.getElementById('webcam');
                const cvStatus = document.getElementById('cv-status');

                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
                        video.srcObject = stream;
                        video.addEventListener('loadeddata', () => {
                            cvStatus.innerText = "CV: Active | Show Hand";
                            this.predictWebcam(handLandmarker, video);
                        });
                    }).catch(err => {
                        cvStatus.innerText = "CV: Blocked";
                        console.error(err);
                    });
                }
            }

            async predictWebcam(landmarker, video) {
                let lastVideoTime = -1;
                const renderLoop = async () => {
                    if (video.currentTime !== lastVideoTime) {
                        lastVideoTime = video.currentTime;
                        const result = landmarker.detectForVideo(video, performance.now());
                        this.processGestures(result);
                    }
                    requestAnimationFrame(renderLoop);
                };
                renderLoop();
            }

            processGestures(result) {
                if (result.landmarks && result.landmarks.length > 0) {
                    const lm = result.landmarks[0]; // Normalized x, y (0-1)

                    // 1. Rotation Logic (Hand Position)
                    // Center of hand (Index 9)
                    const cx = lm[9].x;
                    const cy = lm[9].y;
                    
                    // Map x (0..1) to Rotation Y (-PI..PI)
                    // Moving hand LEFT (x small) -> Rotate Left
                    // Moving hand RIGHT (x large) -> Rotate Right
                    // Smoothed target
                    const targetRotY = (cx - 0.5) * 3.0; // Amplified rotation
                    const targetRotX = (cy - 0.5) * 1.5;

                    STATE.handRotation.x = targetRotX;
                    STATE.handRotation.y = targetRotY;

                    // 2. Expansion Logic (Proximity / Hand Scale)
                    // Estimate distance from camera using palm size
                    // Wrist (0) to Middle Finger Base (9)
                    const dx = lm[0].x - lm[9].x;
                    const dy = lm[0].y - lm[9].y;
                    const dist = Math.sqrt(dx*dx + dy*dy); // Approximate apparent size

                    // dist typically ranges 0.1 (far) to 0.4 (very close)
                    // Rule: Hand Closer (dist large) -> Shrink (Expansion Small)
                    // Rule: Hand Far (dist small) -> Expand (Expansion Large)
                    
                    // Map dist [0.1, 0.4] to expansion [2.0, 0.5]
                    // clamped
                    const clampedDist = Math.max(0.1, Math.min(0.4, dist));
                    const t = (clampedDist - 0.1) / (0.3); // 0 to 1
                    
                    // If t=0 (Far), exp=2.5. If t=1 (Close), exp=0.4
                    STATE.targetExpansion = 2.5 - (t * 2.1); 
                } else {
                    // No hand: Return to default
                    STATE.targetExpansion = 1.0;
                    STATE.handRotation.x = 0;
                    STATE.handRotation.y = 0; // Or keep spinning? Let's reset to center
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                STATE.time += 0.01;

                // Smoothly update expansion
                STATE.expansion += (STATE.targetExpansion - STATE.expansion) * 0.1;

                // Smoothly update rotation
                // Base rotation + Hand Offset
                const baseRot = STATE.time * 0.1; // Continuous slow spin
                this.mainGroup.rotation.y += ((baseRot + STATE.handRotation.y) - this.mainGroup.rotation.y) * 0.05;
                this.mainGroup.rotation.x += (STATE.handRotation.x - this.mainGroup.rotation.x) * 0.05;

                // Dust animation
                if (this.dustSystem) {
                    this.dustSystem.rotation.y = -STATE.time * 0.05;
                }

                // Update Particles
                this.particles.forEach(p => p.update(STATE.time, STATE.expansion));

                this.composer.render();
            }
        }

        // Initialize
        new App();
    </script>
</body>
</html>
